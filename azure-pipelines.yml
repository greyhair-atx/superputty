# .NET Desktop
# Build and run tests for .NET Desktop or Windows classic desktop solutions.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/windows/dot-net

trigger:
  branches:
    include:
    - master
    - integration
    - sp-1.6.1

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'x64'
  testPlatform: 'x64'
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1

# Run Microsoft Security Utility on Source Repository
- task: MicrosoftSecurityDevOps@1
  displayName: 'Run Microsoft Security DevOps'

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'

- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    msbuildArgs: '/restore'

- task: VSTest@3
  displayName: 'Run isolated x64 tests'
  inputs:
    testSelector: 'testAssemblies'
    testAssemblyVer2: |
      **\SuperPuttyUnitTests.exe
      !**\obj\**
    searchFolder: '$(Build.SourcesDirectory)'
    testFiltercriteria: 'TestCategory!=NetworkTest'
    platform: '$(testPlatform)'
    configuration: '$(buildConfiguration)'
    failOnMinTestsNotRun: true
    minimumExpectedTests: '24'

- task: PowerShell@2
  displayName: 'Verify x64 application and MSI payload'
  inputs:
    targetType: 'filePath'
    filePath: '$(Build.SourcesDirectory)\build\Verify-ReleaseArtifacts.ps1'
    arguments: '-Configuration $(buildConfiguration) -Platform $(buildPlatform) -ExpectedVersion 1.6.1.0'
    pwsh: true

- task: PowerShell@2
  displayName: 'Test application shutdown paths'
  inputs:
    targetType: 'filePath'
    filePath: '$(Build.SourcesDirectory)\build\Test-ApplicationShutdown.ps1'
    arguments: '-Configuration $(buildConfiguration) -Platform $(buildPlatform)'
    pwsh: false

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.SourcesDirectory)\SuperPuttyInstaller\bin\x64\$(buildConfiguration)\SuperPuttySetup.msi'
    artifactType: 'pipeline'
    artifactName: 'SuperPutty-1.6.1-win-x64'
