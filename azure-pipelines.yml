# .NET Desktop build and optional Azure Artifact Signing.

parameters:
- name: enableCodeSigning
  displayName: 'Sign release artifacts with Azure Artifact Signing'
  type: boolean
  default: false
- name: azureServiceConnection
  displayName: 'Azure Resource Manager service connection'
  type: string
  default: 'not-configured'

trigger:
  branches:
    include:
    - master
    - integration
  tags:
    include:
    - sp-1.7.3

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'x64'
  testPlatform: 'x64'
  buildConfiguration: 'Release'
  releaseVersion: '1.7.3'
  applicationVersion: '1.7.3.0'
  ${{ if eq(parameters.enableCodeSigning, true) }}:
    installerArtifactSuffix: 'win-x64-signed'
  ${{ else }}:
    installerArtifactSuffix: 'test-x64'

steps:
- task: NuGetToolInstaller@1

# Run Microsoft Security Utility on Source Repository
- task: MicrosoftSecurityDevOps@1
  displayName: 'Run Microsoft Security DevOps'

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'

- task: VSBuild@1
  displayName: 'Build SuperPuTTY x64 application'
  inputs:
    solution: 'SuperPutty\SuperPutty.csproj'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    msbuildArgs: '/restore'

- task: VSBuild@1
  displayName: 'Build x64 unit tests'
  inputs:
    solution: 'SuperPuttyUnitTests\SuperPuttyUnitTests.csproj'
    platform: '$(testPlatform)'
    configuration: '$(buildConfiguration)'
    msbuildArgs: '/restore'

- task: VSTest@3
  displayName: 'Run isolated x64 tests'
  inputs:
    testSelector: 'testAssemblies'
    testAssemblyVer2: |
      **\SuperPuttyUnitTests.exe
      !**\obj\**
    searchFolder: '$(Build.SourcesDirectory)'
    testFiltercriteria: 'TestCategory!=NetworkTest'
    platform: '$(testPlatform)'
    configuration: '$(buildConfiguration)'
    failOnMinTestsNotRun: true
    minimumExpectedTests: '24'

- ${{ if eq(parameters.enableCodeSigning, true) }}:
  - task: AzureCLI@2
    displayName: 'Authenticate to Azure with workload identity federation'
    inputs:
      azureSubscription: '${{ parameters.azureServiceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      addSpnToEnvironment: true
      inlineScript: |
        Write-Host "##vso[task.setvariable variable=ARM_CLIENT_ID;issecret=true]$env:servicePrincipalId"
        Write-Host "##vso[task.setvariable variable=ARM_ID_TOKEN;issecret=true]$env:idToken"
        Write-Host "##vso[task.setvariable variable=ARM_TENANT_ID;issecret=true]$env:tenantId"

  - task: PowerShell@2
    displayName: 'Establish federated Azure CLI session'
    inputs:
      targetType: 'inline'
      pwsh: true
      script: |
        az login `
          --service-principal `
          --username "$(ARM_CLIENT_ID)" `
          --tenant "$(ARM_TENANT_ID)" `
          --federated-token "$(ARM_ID_TOKEN)" `
          --allow-no-subscriptions `
          --output none

  - task: ArtifactSigning@1
    displayName: 'Sign SuperPutty.exe'
    inputs:
      Endpoint: 'https://cus.codesigning.azure.net/'
      ArtifactSigningAccountName: 'greyhair-atx'
      CertificateProfileName: 'greyhair-atx-superputty'
      Files: '$(Build.SourcesDirectory)\bin\x64\$(buildConfiguration)\SuperPutty.exe'
      FileDigest: 'SHA256'
      TimestampRfc3161: 'http://timestamp.acs.microsoft.com'
      TimestampDigest: 'SHA256'
      ExcludeEnvironmentCredential: true
      ExcludeWorkloadIdentityCredential: true
      ExcludeManagedIdentityCredential: true
      ExcludeSharedTokenCacheCredential: true
      ExcludeVisualStudioCredential: true
      ExcludeVisualStudioCodeCredential: true
      ExcludeAzureCliCredential: false
      ExcludeAzurePowershellCredential: true
      ExcludeAzureDeveloperCliCredential: true
      ExcludeInteractiveBrowserCredential: true

- task: VSBuild@1
  displayName: 'Package current-user x64 MSI'
  inputs:
    solution: 'SuperPuttyInstaller\SuperPuttyInstaller.wixproj'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    msbuildArgs: '/restore /p:BuildProjectReferences=false /p:InstallerScope=PerUser /p:InstallerProductVersion=$(releaseVersion) /p:InstallerArtifactSuffix=$(installerArtifactSuffix)'

- task: VSBuild@1
  displayName: 'Package all-users x64 MSI'
  inputs:
    solution: 'SuperPuttyInstaller\SuperPuttyInstaller.wixproj'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    msbuildArgs: '/restore /p:BuildProjectReferences=false /p:InstallerScope=PerMachine /p:InstallerProductVersion=$(releaseVersion) /p:InstallerArtifactSuffix=$(installerArtifactSuffix)'

- ${{ if eq(parameters.enableCodeSigning, true) }}:
  - task: ArtifactSigning@1
    displayName: 'Sign current-user and all-users MSIs'
    inputs:
      Endpoint: 'https://cus.codesigning.azure.net/'
      ArtifactSigningAccountName: 'greyhair-atx'
      CertificateProfileName: 'greyhair-atx-superputty'
      Files: '$(Build.SourcesDirectory)\SuperPuttyInstaller\bin\x64\$(buildConfiguration)\SuperPutty-$(releaseVersion)-*-$(installerArtifactSuffix).msi'
      FileDigest: 'SHA256'
      TimestampRfc3161: 'http://timestamp.acs.microsoft.com'
      TimestampDigest: 'SHA256'
      ExcludeEnvironmentCredential: true
      ExcludeWorkloadIdentityCredential: true
      ExcludeManagedIdentityCredential: true
      ExcludeSharedTokenCacheCredential: true
      ExcludeVisualStudioCredential: true
      ExcludeVisualStudioCodeCredential: true
      ExcludeAzureCliCredential: false
      ExcludeAzurePowershellCredential: true
      ExcludeAzureDeveloperCliCredential: true
      ExcludeInteractiveBrowserCredential: true

- task: PowerShell@2
  displayName: 'Verify current-user x64 application and MSI payload'
  inputs:
    targetType: 'filePath'
    filePath: '$(Build.SourcesDirectory)\build\Verify-ReleaseArtifacts.ps1'
    arguments: '-Configuration $(buildConfiguration) -Platform $(buildPlatform) -ExpectedVersion $(applicationVersion) -InstallerScope PerUser -MsiName SuperPutty-$(releaseVersion)-current-user-$(installerArtifactSuffix).msi'
    pwsh: true

- task: PowerShell@2
  displayName: 'Verify all-users x64 application and MSI payload'
  inputs:
    targetType: 'filePath'
    filePath: '$(Build.SourcesDirectory)\build\Verify-ReleaseArtifacts.ps1'
    arguments: '-Configuration $(buildConfiguration) -Platform $(buildPlatform) -ExpectedVersion $(applicationVersion) -InstallerScope PerMachine -MsiName SuperPutty-$(releaseVersion)-all-users-$(installerArtifactSuffix).msi'
    pwsh: true

- task: PowerShell@2
  displayName: 'Test application shutdown paths'
  inputs:
    targetType: 'filePath'
    filePath: '$(Build.SourcesDirectory)\build\Test-ApplicationShutdown.ps1'
    arguments: '-Configuration $(buildConfiguration) -Platform $(buildPlatform)'
    pwsh: false

- ${{ if eq(parameters.enableCodeSigning, true) }}:
  - task: PowerShell@2
    displayName: 'Verify Authenticode signatures'
    inputs:
      targetType: 'filePath'
      filePath: '$(Build.SourcesDirectory)\build\Verify-CodeSignatures.ps1'
      arguments: '-Configuration $(buildConfiguration) -Platform $(buildPlatform) -InstallerVersion $(releaseVersion) -InstallerArtifactSuffix $(installerArtifactSuffix) -ExpectedSigner "Christopher Thornton"'
      pwsh: true

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.SourcesDirectory)\SuperPuttyInstaller\bin\x64\$(buildConfiguration)\SuperPutty-$(releaseVersion)-current-user-$(installerArtifactSuffix).msi'
    artifactType: 'pipeline'
    artifactName: 'SuperPutty-$(releaseVersion)-current-user-$(installerArtifactSuffix)'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.SourcesDirectory)\SuperPuttyInstaller\bin\x64\$(buildConfiguration)\SuperPutty-$(releaseVersion)-all-users-$(installerArtifactSuffix).msi'
    artifactType: 'pipeline'
    artifactName: 'SuperPutty-$(releaseVersion)-all-users-$(installerArtifactSuffix)'
